name: CI

# CI complements the authoritative local selfcheck gate. It owns evidence a
# developer workstation cannot prove reliably: clean checkout, credentialless
# startup, cross-platform behavior, concurrency, and timing.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOWORK: "off"
  # Hard guard: even if a case forgets, the eval runner must not call out.
  SELFMIND_EVAL_OFFLINE: "1"

jobs:
  gate:
    name: Linux build, test, offline eval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Documentation contract
        run: go run ./cmd/selfmind docs check

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race-sensitive runtime tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/runpool ./internal/control ./internal/gateway/httpapi

      - name: Complete provider-offline release corpus
        # Linux owns the deterministic release corpus. Platform-specific cases
        # still run on their native runner below.
        run: go run ./cmd/selfmind selfcheck --profile local-full --skip-go

      - name: Package and install npm distribution
        run: bash scripts/smoke-npm-packages.sh 0.0.0-ci

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfmind-eval-linux
          path: evalruns/
          if-no-files-found: warn

  macos:
    name: macOS build and test
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: CI-owned platform eval (provider replay only)
        run: go run ./cmd/selfmind selfcheck --profile ci --skip-go

      - name: Package and install npm distribution
        run: bash scripts/smoke-npm-packages.sh 0.0.0-ci

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfmind-eval-macos
          path: evalruns/
          if-no-files-found: warn
