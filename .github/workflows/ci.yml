name: CI

# Regression gate: build + test + offline eval on every push/PR.
# This is the "catch" net (Phase 0 / W0.2). It must never make live model
# calls — eval cases run in offline replay so CI cannot burn provider quota
# and stays deterministic.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOWORK: "off"
  # Hard guard: even if a case forgets, the eval runner must not call out.
  SELFMIND_EVAL_OFFLINE: "1"

jobs:
  gate:
    name: Linux build, test, offline eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Offline eval (replay only)
        # Runs the same gate developers run locally via `selfmind selfcheck`.
        # Optional cases without a recorded cassette are reported and skipped so
        # the gate grows as cassettes are recorded — but cases marked
        # `require_cassette: true` FAIL when their cassette is missing, and
        # SELFMIND_EVAL_MIN_CASES fails the step when fewer cases actually
        # replayed than required (so the gate can never quietly verify ~0 cases).
        env:
          SELFMIND_EVAL_MIN_CASES: "3"
          # SELFMIND_EVAL_MAX_CASE_SECONDS can cap the gate by a case's
          # declared max_duration_seconds. It is deliberately NOT set here.
          # That field is an author-chosen ceiling, not a measure of replay
          # cost: continuity_resume declares 420s and replays in 1s, while the
          # genuinely slow case declares 540s because it really does run the
          # test suite. Filtering on it drops fast, high-value cases and keeps
          # the slow one. The whole step is 64s for 32 cases, and the tool-heavy
          # cases are exactly the ones that surface races a single machine never
          # reproduces, so the coverage is worth the minute.
        run: go run ./cmd/selfmind selfcheck --skip-go

  macos:
    name: macOS build and test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
