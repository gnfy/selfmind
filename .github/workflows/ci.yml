name: CI

# CI complements the authoritative local selfcheck gate. It owns evidence a
# developer workstation cannot prove reliably: clean checkout, credentialless
# startup, cross-platform behavior, concurrency, and timing.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs only for pull requests. A cancelled main push run
  # leaves that SHA without the successful exact-SHA CI evidence the release
  # workflow's source gate requires, blocking any release from it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"
  GOWORK: "off"
  # Hard guard: even if a case forgets, the eval runner must not call out.
  SELFMIND_EVAL_OFFLINE: "1"

jobs:
  # Classifies the diff so documentation-only changes skip the platform,
  # package, and race jobs. The core job (documentation contract, vet, build,
  # full test) and the eval job always run, so every main SHA keeps
  # build/test/corpus evidence. Fails open: any doubt (API error, truncated
  # listing, force push, manual dispatch) counts as a code change.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Detect non-documentation changes
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "code=true" >> "${GITHUB_OUTPUT}"

          files=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)')" || exit 0
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -z "${before}" || "${before}" == "0000000000000000000000000000000000000000" ]]; then
              exit 0
            fi
            files="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${before}...${GITHUB_SHA}" \
              --jq '.files[] | .filename, (.previous_filename // empty)')" || exit 0
            # The compare API caps the file listing; a huge diff is code.
            count="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${before}...${GITHUB_SHA}" --jq '.files | length')" || exit 0
            if [[ "${count}" -ge 300 ]]; then
              exit 0
            fi
          else
            exit 0
          fi

          if [[ -z "${files}" ]]; then
            exit 0
          fi
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            case "${file}" in
              docs/*|README.md|AGENTS.md|CLAUDE.md|CONTEXT.md) ;;
              *)
                exit 0
                ;;
            esac
          done <<<"${files}"
          echo "documentation-only change; platform, package, and race jobs are skipped"
          echo "code=false" >> "${GITHUB_OUTPUT}"

  core:
    name: Linux core checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Documentation contract
        run: go run ./cmd/selfmind docs check

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  race:
    name: Race-sensitive runtime tests (${{ matrix.name }})
    needs: changes
    # Runs on pull requests too. These jobs used to be push-only, so a race or a
    # timeout could only ever be discovered after merging — main went red while
    # the PR that caused it was green (observed 2026-09-04). They were skipped on
    # PRs because they took about 13 minutes each; test databases are now seeded
    # from one built copy instead of re-running the migration chain per test, so
    # the whole matrix finishes in a few minutes.
    #
    # No per-package filter beyond code-vs-docs: a race these packages catch is
    # often introduced somewhere else entirely, so narrowing the trigger to the
    # packages under test would miss exactly the changes worth checking.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runpool
            package: ./internal/runpool
          - name: control
            package: ./internal/control
          - name: httpapi
            package: ./internal/gateway/httpapi
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Race-sensitive runtime tests
        run: go test -race -timeout 12m ${{ matrix.package }}

  eval:
    name: Provider-offline eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Fast provider-offline PR corpus
        if: github.event_name == 'pull_request'
        run: go run ./cmd/selfmind selfcheck --profile local-fast --skip-go

      - name: Complete provider-offline main corpus
        if: github.event_name != 'pull_request'
        run: go run ./cmd/selfmind selfcheck --profile local-full --skip-go

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: selfmind-eval-linux
          path: evalruns/
          if-no-files-found: warn

  npm-linux:
    name: Package and smoke npm on Linux x64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      # Build and stage only the platform this job installs; the release
      # workflow still stages and verifies all four platforms.
      - name: Package and install npm distribution
        run: bash scripts/smoke-npm-packages.sh 0.0.0-ci linux-x64

  macos:
    name: macOS build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: CI-owned platform eval (provider replay only)
        run: go run ./cmd/selfmind selfcheck --profile ci --skip-go

      # Build and stage only the platform this job installs; the release
      # workflow still stages and verifies all four platforms.
      - name: Package and install npm distribution
        run: bash scripts/smoke-npm-packages.sh 0.0.0-ci darwin-arm64

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: selfmind-eval-macos
          path: evalruns/
          if-no-files-found: warn
