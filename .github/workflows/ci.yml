name: CI

# CI complements the authoritative local selfcheck gate. It owns evidence a
# developer workstation cannot prove reliably: clean checkout, credentialless
# startup, cross-platform behavior, concurrency, and timing.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOWORK: "off"
  # Hard guard: even if a case forgets, the eval runner must not call out.
  SELFMIND_EVAL_OFFLINE: "1"

jobs:
  gate:
    name: Linux build, test, offline eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: CI-owned eval (provider replay only)
        # Case ownership is explicit in eval YAML (`ci.required/reason/platforms`).
        # A selected case without a cassette fails; no numeric count can hide it.
        run: go run ./cmd/selfmind selfcheck --profile ci --skip-go

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfmind-eval-linux
          path: evalruns/
          if-no-files-found: warn

  macos:
    name: macOS build and test
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: CI-owned platform eval (provider replay only)
        run: go run ./cmd/selfmind selfcheck --profile ci --skip-go

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfmind-eval-macos
          path: evalruns/
          if-no-files-found: warn
