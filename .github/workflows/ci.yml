name: CI

# CI complements the authoritative local selfcheck gate. It owns evidence a
# developer workstation cannot prove reliably: clean checkout, credentialless
# startup, cross-platform behavior, concurrency, and timing.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOWORK: "off"
  # Hard guard: even if a case forgets, the eval runner must not call out.
  SELFMIND_EVAL_OFFLINE: "1"

jobs:
  core:
    name: Linux core checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Documentation contract
        run: go run ./cmd/selfmind docs check

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  race:
    name: Race-sensitive runtime tests (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runpool
            package: ./internal/runpool
          - name: control
            package: ./internal/control
          - name: httpapi
            package: ./internal/gateway/httpapi
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Race-sensitive runtime tests
        run: go test -race -timeout 12m ${{ matrix.package }}

  eval:
    name: Provider-offline eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Fast provider-offline PR corpus
        if: github.event_name == 'pull_request'
        run: go run ./cmd/selfmind selfcheck --profile local-fast --skip-go

      - name: Complete provider-offline main corpus
        if: github.event_name != 'pull_request'
        run: go run ./cmd/selfmind selfcheck --profile local-full --skip-go

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: selfmind-eval-linux
          path: evalruns/
          if-no-files-found: warn

  npm-linux:
    name: Package and smoke npm on Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Package and install npm distribution
        run: bash scripts/smoke-npm-packages.sh 0.0.0-ci

  macos:
    name: macOS build and test
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: CI-owned platform eval (provider replay only)
        run: go run ./cmd/selfmind selfcheck --profile ci --skip-go

      - name: Package and install npm distribution
        run: bash scripts/smoke-npm-packages.sh 0.0.0-ci

      - name: Upload eval diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: selfmind-eval-macos
          path: evalruns/
          if-no-files-found: warn
