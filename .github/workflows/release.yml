name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0. Leave empty for a dev build."
        required: false
        default: ""
        type: string
      publish_github:
        description: "Publish a GitHub Release"
        required: false
        default: false
        type: boolean
      publish_npm:
        description: "Publish npm packages using trusted publishing"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release and npm packages as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name || inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  BINARY_NAME: selfmind
  CGO_ENABLED: "0"
  GOWORK: "off"
  SELFMIND_EVAL_OFFLINE: "1"

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      npm_version: ${{ steps.meta.outputs.npm_version }}
      npm_dist_tag: ${{ steps.meta.outputs.npm_dist_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish_github: ${{ steps.meta.outputs.publish_github }}
      publish_npm: ${{ steps.meta.outputs.publish_npm }}
      built_at: ${{ steps.meta.outputs.built_at }}
    steps:
      - name: Resolve version and channels
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            publish_github="true"
            publish_npm="true"
            prerelease="false"
          else
            tag="${{ inputs.tag }}"
            publish_github="${{ inputs.publish_github }}"
            publish_npm="${{ inputs.publish_npm }}"
            prerelease="${{ inputs.prerelease }}"
          fi

          if [[ -z "${tag}" && ( "${publish_github}" == "true" || "${publish_npm}" == "true" ) ]]; then
            echo "an explicit release tag is required when publication is enabled" >&2
            exit 1
          fi
          if [[ -z "${tag}" ]]; then
            stamp="$(date -u +%Y%m%d%H%M%S)"
            tag="v0.0.0-dev.${stamp}.${GITHUB_SHA::7}"
          fi

          npm_version="${tag#v}"
          if [[ ! "${npm_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must contain a valid npm semantic version: ${tag}" >&2
            exit 1
          fi

          if [[ "${npm_version}" == *-* ]]; then
            prerelease="true"
          fi
          if [[ "${prerelease}" == "true" ]]; then
            npm_dist_tag="next"
          else
            npm_dist_tag="latest"
          fi

          {
            echo "tag=${tag}"
            echo "npm_version=${npm_version}"
            echo "npm_dist_tag=${npm_dist_tag}"
            echo "prerelease=${prerelease}"
            echo "publish_github=${publish_github}"
            echo "publish_npm=${publish_npm}"
            echo "built_at=${built_at}"
          } >> "${GITHUB_OUTPUT}"

  source:
    name: Verify main source and CI
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a verified main commit and successful main CI
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PUBLISH_GITHUB: ${{ needs.metadata.outputs.publish_github }}
          PUBLISH_NPM: ${{ needs.metadata.outputs.publish_npm }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_GITHUB}" != "true" && "${PUBLISH_NPM}" != "true" ]]; then
            echo "publication disabled; source guard is not required for this build"
            exit 0
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "publish commit ${GITHUB_SHA} is not reachable from origin/main" >&2
            exit 1
          fi

          ci_run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')"
          if [[ -z "${ci_run_id}" ]]; then
            echo "publish commit ${GITHUB_SHA} has no successful main CI push run" >&2
            echo "wait for main CI to pass, then rerun this workflow" >&2
            exit 1
          fi
          echo "verified main CI run ${ci_run_id} for ${GITHUB_SHA}"

          remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [[ -z "${remote_tag}" ]]; then
            remote_tag="$(git ls-remote --refs --tags origin "refs/tags/${TAG}" | cut -f1)"
          fi
          if [[ -z "${remote_tag}" ]]; then
            if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "tag-triggered release cannot resolve ${TAG} on origin" >&2
              exit 1
            fi
            echo "release tag ${TAG} will be created after package verification"
            exit 0
          fi
          if [[ "${remote_tag}" != "${GITHUB_SHA}" ]]; then
            echo "publish tag ${TAG} points at ${remote_tag}, not workflow commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "verified ${TAG} -> ${GITHUB_SHA} on origin/main"

  test:
    name: Stable release gate
    needs:
      - metadata
      - source
    runs-on: ubuntu-latest
    steps:
      - name: Reuse successful main CI for prerelease
        if: needs.metadata.outputs.prerelease == 'true'
        run: echo "prerelease reuses the successful exact-SHA main CI gate"

      - name: Checkout
        if: needs.metadata.outputs.prerelease != 'true'
        uses: actions/checkout@v4

      - name: Set up Go
        if: needs.metadata.outputs.prerelease != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Documentation contract
        if: needs.metadata.outputs.prerelease != 'true'
        run: go run ./cmd/selfmind docs check

      - name: Vet
        if: needs.metadata.outputs.prerelease != 'true'
        run: go vet ./...

      - name: Build
        if: needs.metadata.outputs.prerelease != 'true'
        run: go build ./...

      - name: Test
        if: needs.metadata.outputs.prerelease != 'true'
        run: go test ./...

      - name: Race-sensitive runtime tests
        if: needs.metadata.outputs.prerelease != 'true'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/runpool ./internal/control ./internal/gateway/httpapi

      - name: Complete provider-offline release corpus
        if: needs.metadata.outputs.prerelease != 'true'
        run: go run ./cmd/selfmind selfcheck --profile local-full --skip-go

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs:
      - metadata
      - source
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            npm_arch: x64
          - goos: linux
            goarch: arm64
            npm_arch: arm64
          - goos: darwin
            goarch: amd64
            npm_arch: x64
          - goos: darwin
            goarch: arm64
            npm_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          BUILT_AT: ${{ needs.metadata.outputs.built_at }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="${BINARY_NAME}-${RELEASE_TAG}-${GOOS}-${GOARCH}"
          package_dir="dist/${package_name}"
          artifact_dir="artifact"

          mkdir -p "${package_dir}" "${artifact_dir}/native" "${artifact_dir}/release-assets"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X selfmind/internal/buildinfo.Version=${RELEASE_TAG} \
              -X selfmind/internal/buildinfo.Commit=${GITHUB_SHA} \
              -X selfmind/internal/buildinfo.BuiltAt=${BUILT_AT}" \
            -o "${artifact_dir}/native/${BINARY_NAME}" \
            ./cmd/selfmind

          cp "${artifact_dir}/native/${BINARY_NAME}" "${package_dir}/${BINARY_NAME}"
          cp README.md "${package_dir}/"
          if [[ -d docs ]]; then
            cp -R docs "${package_dir}/docs"
          fi
          chmod +x \
            "${artifact_dir}/native/${BINARY_NAME}" \
            "${package_dir}/${BINARY_NAME}"
          tar -C dist -czf \
            "${artifact_dir}/release-assets/${package_name}.tar.gz" \
            "${package_name}"

          if [[ "${GOOS}" == "linux" && "${GOARCH}" == "amd64" ]]; then
            "${artifact_dir}/native/${BINARY_NAME}" --version
          else
            file "${artifact_dir}/native/${BINARY_NAME}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfmind-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Package npm artifacts and smoke Linux x64
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: selfmind-*
          path: downloaded

      - name: Stage npm packages
        env:
          NPM_VERSION: ${{ needs.metadata.outputs.npm_version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-npm-packages.mjs \
            --version "${NPM_VERSION}" \
            --linux-x64 downloaded/selfmind-linux-amd64/native/selfmind \
            --linux-arm64 downloaded/selfmind-linux-arm64/native/selfmind \
            --darwin-x64 downloaded/selfmind-darwin-amd64/native/selfmind \
            --darwin-arm64 downloaded/selfmind-darwin-arm64/native/selfmind \
            --out .npm-stage

      - name: Pack npm packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-packs
          npm pack .npm-stage/selfmind-linux-x64 --pack-destination npm-packs
          npm pack .npm-stage/selfmind-linux-arm64 --pack-destination npm-packs
          npm pack .npm-stage/selfmind-darwin-x64 --pack-destination npm-packs
          npm pack .npm-stage/selfmind-darwin-arm64 --pack-destination npm-packs
          npm pack .npm-stage/selfmind --pack-destination npm-packs
          ls -lah npm-packs

      - name: Smoke test npm installation
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-smoke
          cd npm-smoke
          npm init -y >/dev/null

          main_package="$(find ../npm-packs -maxdepth 1 -type f -name 'selfmind-cli-[0-9]*.tgz' -print -quit)"
          platform_package="$(find ../npm-packs -maxdepth 1 -type f -name 'selfmind-cli-linux-x64-*.tgz' -print -quit)"
          if [[ -z "${main_package}" || -z "${platform_package}" ]]; then
            echo "npm package archives are missing" >&2
            exit 1
          fi

          npm install --ignore-scripts --omit=optional --no-audit --no-fund \
            "${platform_package}" "${main_package}"
          installed_version="$(./node_modules/.bin/selfmind --version)"
          echo "${installed_version}"
          grep -F "${EXPECTED_VERSION}" <<<"${installed_version}"

      - name: Smoke installed gateway lifecycle on Linux x64
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.tag }}
        run: bash scripts/smoke-installed-gateway.sh npm-smoke/node_modules/.bin/selfmind "${EXPECTED_VERSION}"

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfmind-npm-packages
          path: npm-packs/*.tgz
          if-no-files-found: error
          retention-days: 14

  finalize-tag:
    name: Finalize release tag
    needs:
      - metadata
      - source
      - npm
      - npm-smoke-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publication disabled
        if: ${{ needs.metadata.outputs.publish_github != 'true' && needs.metadata.outputs.publish_npm != 'true' }}
        run: echo "publication disabled; no release tag will be created"

      - name: Checkout verified source
        if: ${{ needs.metadata.outputs.publish_github == 'true' || needs.metadata.outputs.publish_npm == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or verify exact release tag
        if: ${{ needs.metadata.outputs.publish_github == 'true' || needs.metadata.outputs.publish_npm == 'true' }}
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: bash scripts/finalize-release-tag.sh

  publish-npm:
    name: Publish verified npm artifacts
    needs:
      - metadata
      - source
      - npm
      - npm-smoke-macos
      - finalize-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install trusted-publishing npm CLI
        if: ${{ needs.metadata.outputs.publish_npm == 'true' }}
        run: npm install --global npm@11.5.1

      - name: Download verified npm package archives
        if: ${{ needs.metadata.outputs.publish_npm == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: selfmind-npm-packages
          path: npm-packs

      - name: Publish platform packages, then launcher
        if: ${{ needs.metadata.outputs.publish_npm == 'true' }}
        env:
          DIST_TAG: ${{ needs.metadata.outputs.npm_dist_tag }}
          NPM_VERSION: ${{ needs.metadata.outputs.npm_version }}
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            "@selfmind/cli-linux-x64:selfmind-cli-linux-x64-${NPM_VERSION}.tgz"
            "@selfmind/cli-linux-arm64:selfmind-cli-linux-arm64-${NPM_VERSION}.tgz"
            "@selfmind/cli-darwin-x64:selfmind-cli-darwin-x64-${NPM_VERSION}.tgz"
            "@selfmind/cli-darwin-arm64:selfmind-cli-darwin-arm64-${NPM_VERSION}.tgz"
            "@selfmind/cli:selfmind-cli-${NPM_VERSION}.tgz"
          )

          for entry in "${packages[@]}"; do
            archive="${entry#*:}"
            archive_path="./npm-packs/${archive}"
            if ! test -f "${archive_path}"; then
              echo "verified npm package archive is missing: ${archive_path}" >&2
              exit 1
            fi
          done

          existing=0
          for entry in "${packages[@]}"; do
            package="${entry%%:*}"
            if npm view "${package}@${NPM_VERSION}" dist.integrity >/dev/null 2>&1; then
              existing=$((existing + 1))
            fi
          done
          if [[ "${existing}" -ne 0 && "${existing}" -ne "${#packages[@]}" ]]; then
            echo "npm version ${NPM_VERSION} is only partially published (${existing}/${#packages[@]} packages)" >&2
            echo "this version is terminal; bump the version instead of assembling it across workflow runs" >&2
            exit 1
          fi

          verify_existing() {
            local package="$1" archive="$2" local_integrity remote_integrity
            local_integrity="sha512-$(openssl dgst -sha512 -binary "./npm-packs/${archive}" | openssl base64 -A)"
            remote_integrity="$(npm view "${package}@${NPM_VERSION}" dist.integrity)"
            if [[ "${remote_integrity}" != "${local_integrity}" ]]; then
              echo "published ${package}@${NPM_VERSION} does not match the verified artifact" >&2
              exit 1
            fi
            echo "verified existing ${package}@${NPM_VERSION} integrity"
          }

          if [[ "${existing}" -eq "${#packages[@]}" ]]; then
            for entry in "${packages[@]}"; do
              verify_existing "${entry%%:*}" "${entry#*:}"
            done
            exit 0
          fi

          for entry in "${packages[@]:0:4}"; do
            archive="${entry#*:}"
            npm publish "./npm-packs/${archive}" --access public --provenance --tag "${DIST_TAG}"
          done
          launcher_archive="${packages[4]#*:}"
          npm publish "./npm-packs/${launcher_archive}" --access public --provenance --tag "${DIST_TAG}"

      - name: Publication disabled
        if: ${{ needs.metadata.outputs.publish_npm != 'true' }}
        run: echo "npm publication disabled; verified package artifacts remain attached to this run"

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - build
      - npm
      - npm-smoke-macos
      - finalize-tag
      - publish-npm
    if: ${{ needs.metadata.outputs.publish_github == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-artifacts -type f \
            \( -name "*.tar.gz" -o -name "*.tgz" \) \
            -exec cp {} release-assets/ \;

          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "SelfMind ${{ needs.metadata.outputs.tag }}"
            echo
            echo "Install the official Linux, macOS, or WSL npm package:"
            echo
            echo '```bash'
            echo "npm install -g @selfmind/cli@${{ needs.metadata.outputs.npm_dist_tag }}"
            echo "selfmind setup"
            echo '```'
            echo
            echo "Linux/macOS tarballs and npm package archives are attached below."
            echo "Verify downloads with SHA256SUMS.txt."
          } > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          release_args=(
            --title "SelfMind ${tag}"
            --notes-file RELEASE_NOTES.md
            --target "${GITHUB_SHA}"
          )

          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* "${release_args[@]}"
          fi

  npm-smoke-macos:
    name: Smoke npm on macOS arm64
    needs:
      - metadata
      - npm
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download npm package archives
        uses: actions/download-artifact@v4
        with:
          name: selfmind-npm-packages
          path: npm-packs

      - name: Install packed launcher and native package
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir npm-smoke
          cd npm-smoke
          npm init -y >/dev/null

          main_package="$(find ../npm-packs -maxdepth 1 -type f -name 'selfmind-cli-[0-9]*.tgz' -print -quit)"
          platform_package="$(find ../npm-packs -maxdepth 1 -type f -name 'selfmind-cli-darwin-arm64-*.tgz' -print -quit)"
          test -n "${main_package}"
          test -n "${platform_package}"

          npm install --ignore-scripts --omit=optional --no-audit --no-fund \
            "${platform_package}" "${main_package}"
          installed_version="$(./node_modules/.bin/selfmind --version)"
          echo "${installed_version}"
          grep -F "${EXPECTED_VERSION}" <<<"${installed_version}"

      - name: Smoke installed gateway lifecycle on macOS arm64
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.tag }}
        run: bash scripts/smoke-installed-gateway.sh npm-smoke/node_modules/.bin/selfmind "${EXPECTED_VERSION}"
