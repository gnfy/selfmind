id: coding_python_declared_verification
title: "a Python change discovers and runs the existing test workflow"
suite: coding-foundations
workspace: isolated
channel: cli
require_cassette: true
ci:
  required: true
  reason: cross_platform
  platforms: [linux, darwin]
requires:
  commands: [python3, make]

# Record after intentional coding-loop changes:
#   SELFMIND_EVAL_VCR=record selfmind eval run \
#     evalcases/coding-foundations/python-declared-verification.yaml --live
setup:
  files:
    AGENTS.md: |
      # Verification

      After the final edit, run the declared project check exactly once:

      ```sh
      make test
      ```
    Makefile: |
      .RECIPEPREFIX := >
      .PHONY: test
      test:
      >python3 -m unittest discover -s tests -v
    calculator.py: |
      def multiply(a, b):
          return a + b
    tests/test_calculator.py: |
      import unittest

      from calculator import multiply

      class CalculatorTest(unittest.TestCase):
          def test_multiply(self):
              self.assertEqual(multiply(3, 4), 12)


      if __name__ == "__main__":
          unittest.main()
turns:
  - input: "Fix the failing Python implementation. Inspect the project first, then run the existing verification after the final edit."

expect:
  status: completed
  completion_reason: completed
  verification_state: passed
  require_tool_events: true
  min_tool_calls: 2
  max_tool_errors: 1
  max_duration_seconds: 180

assert_state:
  - on: file
    path: "calculator.py"
    exists: true
    contains: "a * b"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
