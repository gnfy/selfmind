id: continuity_resume
title: "cross-endpoint continuity: '继续' from weixin resumes the CLI task"
suite: continuity
# Declared isolated because this case makes no tool calls: nothing here
# reads the repository, and a workspace of "." would let one added tool
# call silently make the cassette depend on the tree it was recorded in.
workspace: isolated
channel: cli
require_cassette: true

# North-star scenario: the CLI turn proposes a plan and COMPLETES; a bare
# `继续` arriving on the weixin channel continues the CONTENT via the
# cross-endpoint spine. With simplification P2, completed work has no
# resumable run, so the cue is ordinary new work owning its own root task —
# `require_task_switch` pins that deterministic grouping while
# `must_not_contain` pins the answer continuity ("continue what?" is a fail).
# Run-precise resume of a WAITING run is covered by Go tests at ProcessMessage
# (parent claim); a waiting-turn cassette is a recording follow-up.
turns:
  - input: "帮我规划'重构配置加载'的方案,先给 3 步,每步一句话,不要写代码、不要看本地文件。"
    channel: cli
  - input: "继续"
    channel: weixin

expect:
  status: completed
  require_task_switch: true
  max_tool_calls: 0
  max_tool_errors: 2
  max_duration_seconds: 420
  must_not_contain:
    - "不知道你要继续什么"
    - "<tool>"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
