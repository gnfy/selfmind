id: continuity_task_attach
title: "pre-label semantics: an ordinary follow-up runs under the open current label"
# The cassette is mandatory. Re-record it whenever this scenario's expected
# behavior changes:
#   SELFMIND_EVAL_VCR=record selfmind eval run evalcases/continuity/continuity-task-attach.yaml --live
# Commit the gap-free .vcr/continuity_task_attach/ generation with this file.
require_cassette: true
suite: continuity
workspace: "."
channel: cli

# Work Timeline P3 (docs/work-timeline.md "Labels"/"Ingress"): an ordinary
# message with no continuation evidence PRE-LABELS onto the person's current
# OPEN task instead of spawning a context-less task per message. This is
# harmless by construction — context is spine-based, the execution workspace
# follows the request, and the post-run labeler can re-point the run — so the
# old capture-bug assertion (turn 2 had to switch task ids) is inverted: both
# turns stay on one label and must still complete cleanly with no tool calls.
# (The cassette is sequence-keyed, so it replays across the semantics change.)
# Deterministic Go coverage: internal/gateway/httpapi/task_attach_test.go,
# internal/gateway/httpapi/run_labeler_test.go. The daemon transport that
# carries this turn is separately locked by the unified RunEvent integration
# tests: committed cursor replay, SSE reconnect, person isolation, and terminal
# event delivery in internal/control, internal/gateway/httpapi, and
# internal/gateway/client.
turns:
  - input: "帮我规划'重构配置加载'的方案,先给 3 步,每步一句话,不要写代码、不要看本地文件。"
  - input: "用一句话解释 SQLite 的 WAL 模式是什么,不要看本地文件,不要写代码。"

expect:
  status: completed
  max_tool_calls: 0
  max_duration_seconds: 420

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
