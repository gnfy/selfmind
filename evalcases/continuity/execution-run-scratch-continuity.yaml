id: execution_run_scratch_continuity
title: "temp state written by one command is readable by the next command of the same run"
suite: continuity
workspace: isolated
channel: cli

# The live defect this pins: an isolated command received a FRESH private /tmp on
# every invocation, so a file written by one command was gone by the next, and
# host-mode commands saw the real /tmp instead — two different namespaces for the
# same literal path. Five real handoffs were lost that way in one day (a
# kubeconfig, a generated password, two JSON dumps).
#
# $SELFMIND_RUN_TMP is the ONLY cross-mode promise, so the case exercises exactly
# that: write through it in one turn, read it back in the next. Literal /tmp
# continuity is deliberately NOT asserted — host mode cannot provide it, and a
# case that demanded it would encode a guarantee the product does not make.
turns:
  - input: "Write the text scratch-continuity-ok into a file named handoff.txt inside $SELFMIND_RUN_TMP using the terminal tool. Do not explain, just do it."
  - input: "Now read $SELFMIND_RUN_TMP/handoff.txt with the terminal tool and tell me exactly what it contains."

expect:
  status: completed
  max_tool_errors: 1
  max_duration_seconds: 180
  contains:
    - "scratch-continuity-ok"
  # A state-write denial must never be reported as an authentication failure:
  # that misdiagnosis told the model to fix a login that was not broken.
  disallowed_error_category:
    - auth
    - credential_missing

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
