id: execution_view_controls
title: "execution view discovery is a deterministic person-scoped command"
suite: continuity
workspace: isolated
channel: cli
model_required: false
ci:
  required: true
  reason: cross_platform
  platforms: [linux, darwin]

turns:
  - input: "/views"

expect:
  status: completed
  max_tool_calls: 0
  max_tool_errors: 0
  max_duration_seconds: 30
  contains:
    - "No execution views for recent runs."

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
