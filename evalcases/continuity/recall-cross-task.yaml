id: recall_cross_task
title: "automatic recall v1: related prior work surfaces on a NEW task's turn"
require_cassette: true
suite: continuity
# Declared isolated because this case makes no tool calls: nothing here
# reads the repository, and a workspace of "." would let one added tool
# call silently make the cassette depend on the tree it was recorded in.
workspace: isolated
channel: cli

# Work Timeline P2: turn 1 parks a planning task about the KOF game. An
# explicit /new control turn opens a separate label without consuming a model
# response. The final turn must receive an automatic recall slice from turn 1.
turns:
  - input: "帮我规划一个九七格斗游戏网页版的实现方案，先给 3 步，每步一句话，不要写代码，不要看本地文件。"
  - input: "/new 宣传文案"
  - input: "另外写一段九七格斗游戏的宣传文案，两句话即可，不要写代码，不要看本地文件。"

expect:
  status: completed
  require_task_switch: true
  max_tool_calls: 0
  max_duration_seconds: 420

assert_state:
  - { on: events, type: context.recall, count_gte: 1 }

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
