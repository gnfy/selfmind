id: daily_identity
title: "simple identity question (fast-path, no tools)"
suite: daily-v1
workspace: isolated
channel: cli
turns:
  - input: "你好,你是谁?用一句话简短回答。"
expect:
  status: completed
  max_tool_calls: 0
checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
assert_state:
  - { on: events, type: "tool.started", count_lte: 0 }
