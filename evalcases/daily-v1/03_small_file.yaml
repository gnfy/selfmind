id: daily_small_file
title: "write a tiny script (default coding path)"
suite: daily-v1
workspace: isolated
channel: cli
turns:
  - input: "在当前目录写一个 hello.py,运行时打印 Hello, World。保持最简,直接写文件。"
expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
checks:
  no_mojibake: true
  no_empty_response: true
assert_state:
  - { on: file, path: hello.py, exists: true }
  - { on: file, path: hello.py, contains: "Hello" }
  - { on: file, path: hello.py, matches: "print" }
  - { on: events, type: "tool.completed", count_gte: 1 }
