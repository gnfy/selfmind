id: daily_plan
title: "multi-step task uses a plan then implements"
suite: daily-v1
workspace: isolated
channel: cli
turns:
  - input: "做一个最简命令行计算器 calc.py,支持命令行参数做加法(如 calc.py 2 3 输出 5)。请先用计划列步骤再实现,保持简短。"
expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
checks:
  no_mojibake: true
  no_empty_response: true
assert_state:
  - { on: file, path: calc.py, exists: true }
  - { on: file, path: calc.py, matches: "argv|sys|int\\(" }
