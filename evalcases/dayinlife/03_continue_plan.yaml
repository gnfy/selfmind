id: dayinlife_continue_plan
title: "multi-turn plan refinement keeps the same task and continues"
suite: dayinlife
workspace: "."
channel: cli
turns:
  - input: "帮我规划'给一个目录的图片批量加水印'的小工具,先给 3 步方案,不要写代码、不要看本地文件,每步一句话。"
  - input: "可以,继续,把第一步细化成开发清单,最多 4 条,仍然不要写代码。"
expect:
  status: completed
  require_same_task: true
  require_continuation: true
  max_tool_calls: 0
  max_tool_errors: 2
  max_duration_seconds: 420
  must_not_contain:
    - "不知道你要继续什么"
    - "<tool>"
checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
