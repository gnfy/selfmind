id: dayinlife_continue_plan
title: "multi-turn plan refinement keeps the same task and continues"
suite: dayinlife
# Declared isolated because this case makes no tool calls: nothing here
# reads the repository, and a workspace of "." would let one added tool
# call silently make the cassette depend on the tree it was recorded in.
workspace: isolated
channel: cli
turns:
  - input: "帮我规划'给一个目录的图片批量加水印'的小工具,先给 3 步方案,不要写代码、不要看本地文件,每步一句话。"
  - input: "可以,继续,把第一步细化成开发清单,最多 4 条,仍然不要写代码。"
# P2: turn 1 completes, so the follow-up owns its own root task; answer
# continuity flows through the spine (content checks below).
expect:
  status: completed
  require_task_switch: true
  max_tool_calls: 0
  max_tool_errors: 2
  max_duration_seconds: 420
  must_not_contain:
    - "不知道你要继续什么"
    - "<tool>"
checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
