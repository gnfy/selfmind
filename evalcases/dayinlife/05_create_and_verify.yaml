# NOTE: This scenario doubles as a provider-resilience probe. Verified 2026-06-28
# that its failures are model/provider-side, not a harness bug: codex returned
# `provider_transport` (codex Responses stream failed 3 retries, tools=0) and
# kimi-coding looped to the budget. The harness diagnoses it correctly. The
# duration budget is kept tight so a flaky turn fails fast with a diagnosis
# instead of appearing stalled (AGENTS.md: hard tasks must not appear stalled).
id: dayinlife_create_and_verify
title: "create a named file with exact content (write + verify, state-asserted)"
suite: dayinlife
workspace: "."
channel: cli
turns:
  - input: "在当前工作目录创建一个名为 selfmind_ready.txt 的文件,内容正好是一行:SelfMind ready。创建后确认它存在。"
expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 4
  max_duration_seconds: 150
  must_not_contain:
    - "<tool>"
assert_state:
  - on: file
    path: "selfmind_ready.txt"
    exists: true
    min_bytes: 5
  - on: file
    path: "selfmind_ready.txt"
    contains: "SelfMind ready"
checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
