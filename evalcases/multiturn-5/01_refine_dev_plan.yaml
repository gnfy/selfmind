id: multiturn_refine_dev_plan
title: "multi-turn development plan refinement should keep task context"
suite: multiturn-5
workspace: "."
channel: cli

turns:
  - input: "基于已知背景：SelfMind 是一个面向开发任务和多端协同的 AI 工作助手。请分析工具调用可视化体验的一个可改进点，给三步方案；不要查看本地文件，不要改代码，最多 120 字。"
  - input: "可以，继续，把第一步细化成开发清单；仍然不要改代码，最多 4 条。"
  - input: "基于刚才的开发清单，补充验证方法和风险点；最多 4 条。"

expect:
  status: completed
  require_same_task: true
  require_continuation: true
  max_tool_calls: 0
  max_tool_errors: 3
  max_duration_seconds: 420
  contains:
    - "验证"
  must_not_contain:
    - "不知道你要继续什么"
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
