id: multiturn_tool_failure_recovery
title: "tool failure should be diagnosed across turns without language-specific assumptions"
suite: multiturn-5
workspace: "."
channel: cli

turns:
  - input: "检查当前项目应该如何运行验证。请先做最小化只读探测；如果命令失败，请分析错误原因，不要修改文件，最终回答最多 150 字。"
  - input: "继续分析刚才遇到的错误，找一个更稳妥的下一步，不要重复套用固定语言的环境变量；最多 120 字。"

expect:
  status: completed
  require_same_task: true
  require_continuation: true
  require_tool_events: true
  min_tool_calls: 1
  max_tool_calls: 8
  max_tool_errors: 6
  max_duration_seconds: 540
  contains:
    - "项目"
  must_not_contain:
    - "llm stream chat failed"
    - "responses API error"
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
