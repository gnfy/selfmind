id: multiturn_long_context_followup
title: "longer codebase discussion should keep the useful summary for follow-up"
suite: multiturn-5
workspace: "."
channel: cli

turns:
  - input: "基于这段已知架构摘要，不要查看本地文件：SelfMind 包含 CLI 交互层、gateway 多端入口、kernel agent 推理与工具循环、eval 自动评测。请用 4 条说明职责，最多 150 字。"
  - input: "基于前面的分析，只挑出最影响日常使用体验的两个 P0 问题；最多 100 字。"
  - input: "继续，把这两个 P0 问题整理成修复顺序；最多 4 条。"

expect:
  status: completed
  require_same_task: true
  require_continuation: true
  max_tool_calls: 0
  max_tool_errors: 4
  max_duration_seconds: 600
  contains:
    - "CLI"
  must_not_contain:
    - "不知道你要继续什么"
    - "maximum context"
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
