id: multiturn_cross_channel_continue
title: "same user should continue a task across CLI and IM-style channels"
suite: multiturn-5
workspace: "."
channel: cli

turns:
  - input: "先给一个优化 SelfMind 多端任务状态同步体验的三步方案，不要查看本地文件，也不要改代码，最多 120 字。"
    channel: cli
  - input: "这个任务现在做到哪了？请最多 80 字。"
    channel: weixin
  - input: "继续执行第一步，仍然不要改代码，只把第一步细化，最多 4 条。"
    channel: weixin

expect:
  status: completed
  require_same_task: true
  require_continuation: true
  max_tool_calls: 0
  max_tool_errors: 2
  max_duration_seconds: 420
  contains:
    - "第一步"
  must_not_contain:
    - "不知道你要继续什么"
    - "没有找到任务"
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
