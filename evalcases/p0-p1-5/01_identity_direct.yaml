id: p0p1_identity_direct
title: "identity and model question should not call tools"
suite: p0-p1-5
workspace: "."
channel: cli

turns:
  - input: "你是谁？当前连接的模型是什么？"

expect:
  status: completed
  max_tool_calls: 0
  max_tool_errors: 0
  max_duration_seconds: 120
  contains:
    - "SelfMind"
  must_not_contain:
    - "<tool>"
    - "llm stream chat failed"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
