id: p0p1_php_snippet
title: "small coding snippet should answer cleanly"
suite: p0-p1-5
workspace: "."
channel: cli

turns:
  - input: "用 PHP 实现一个连接 PostgreSQL 并查询一行数据的最小示例，只要代码和简短说明，不要创建文件。"

expect:
  status: completed
  max_tool_errors: 0
  max_duration_seconds: 180
  contains:
    - "PDO"
  must_not_contain:
    - "<tool>"
    - "{\"plan\""

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
