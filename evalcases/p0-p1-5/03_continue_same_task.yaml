id: p0p1_continue_same_task
title: "continue should reuse the active task context"
suite: p0-p1-5
workspace: "."
channel: cli

turns:
  - input: "\u5148\u7ed9\u4e00\u4e2a\u6539\u8fdb SelfMind \u4efb\u52a1\u72b6\u6001\u5c55\u793a\u7684\u4e09\u6b65\u65b9\u6848\uff0c\u4e0d\u8981\u6539\u4ee3\u7801\u3002"
  - input: "\u53ef\u4ee5\uff0c\u7ee7\u7eed\uff0c\u628a\u65b9\u6848\u7ec6\u5316\u6210\u53ef\u6267\u884c\u6e05\u5355\u3002"

expect:
  status: completed
  require_same_task: true
  require_continuation: true
  max_tool_errors: 0
  max_duration_seconds: 240
  must_not_contain:
    - "no task to continue"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
