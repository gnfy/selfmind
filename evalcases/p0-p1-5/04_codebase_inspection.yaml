id: p0p1_codebase_inspection
title: "codebase inspection should show tool progress"
suite: p0-p1-5
workspace: "."
channel: cli

turns:
  - input: "分析一下当前 selfmind 项目的网关和 agent 入口在哪里，给出简短结论。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 2
  max_duration_seconds: 300
  contains:
    - "selfmind"
  must_not_contain:
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
