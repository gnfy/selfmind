id: p0p1_env_diagnosis
title: "environment diagnosis should inspect ecosystem before choosing commands"
suite: p0-p1-5
workspace: "."
channel: cli

turns:
  - input: "诊断当前项目应该如何运行验证。请先识别项目生态、manifest、脚本和 CI 配置，再给出正确做法；不要预设语言，也不要修改文件。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 6
  max_duration_seconds: 300
  contains:
    - "项目"
  must_not_contain:
    - "llm stream chat failed"
    - "responses API error"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
