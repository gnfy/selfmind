turns:
  - input: >-
      Inspect these three fixture files using only local read-only tools.
      First use batch_read to read long-facts.txt and lookup.cfg together.
      If the batch output is truncated, retrieve its omitted middle with the
      returned tool_output_view artifact reference; do not re-read long-facts.txt.
      Also use search_files on lookup.cfg with pattern ^active_(alpha|beta)=,
      match_mode regex and output_mode content, and read_file on window.txt
      with offset 2, limit 1 and line_numbers true. Report the FACT-SOURCE value,
      active_beta value and WINDOW-CHECK value in one short final answer.
      Do not use terminal commands or modify files. This is a lookup, not a coding task.
expect:
  status: completed
  max_tool_errors: 0
  max_invoked_tool_errors: 0
  max_tool_calls: 10
  contains: [N4C-2719-MIDDLE, blue, L2-847]
assert_state:
  - on: events
    type: tool.started
    payload_contains: '"tool":"batch_read"'
    count_gte: 1
    count_lte: 1
  - on: events
    type: tool.started
    payload_contains: '"tool":"tool_output_view"'
    count_gte: 1
  - on: events
    type: tool.started
    payload_contains: '"tool":"search_files"'
    count_gte: 1
checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
