id: realuser_vague_then_detail
title: "mobile user: vague ask, then fills in detail"
suite: realuser-v1
tier: smoke
workspace: isolated
channel: weixin

turns:
  - input: "帮我写个小工具"
  - input: "就是把当前目录下所有 .txt 文件的文件名打印出来,用 Python,存成 list_txt.py,简短就行,直接写文件。"

expect:
  status: completed
  require_same_task: true
checks:
  no_mojibake: true
  no_empty_response: true

assert_state:
  - { on: file, path: list_txt.py, exists: true }
  - { on: file, path: list_txt.py, contains: ".txt" }
  - { on: file, path: list_txt.py, matches: "os\\.|glob|listdir|walk" }
  - { on: task, field: status, not_contains: "blocked" }
