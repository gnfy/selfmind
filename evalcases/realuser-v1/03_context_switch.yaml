id: realuser_context_switch
title: "user interrupts mid-task then resumes"
suite: realuser-v1
tier: smoke
workspace: isolated
channel: cli

turns:
  - input: "帮我给一个小项目起草一个 README,先说说你打算写哪些小节就好,先别建文件。"
  - input: "等下 —— 哦算了,就按你说的,把 README 写成 README.md,简短几句即可。"

expect:
  status: completed
  require_same_task: true
checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true

# Soft assertions: an interrupted/resumed conversation must stay healthy and
# eventually produce the file the user asked for.
assert_state:
  - { on: task, field: status, not_contains: "blocked" }
  - { on: file, path: README.md, exists: true }
