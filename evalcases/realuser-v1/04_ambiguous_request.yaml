id: realuser_ambiguous_request
title: "ambiguous mobile request stays graceful (no crash, not blocked)"
suite: realuser-v1
tier: smoke
workspace: isolated
channel: weixin

turns:
  - input: "帮我把那个配置文件改一下"

expect:
  status: completed
checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
  no_provider_stack_dump: true

# An underspecified ask should not crash, dump errors, or hard-block. We assert
# safety/graceful-handling rather than a specific artifact, because the right
# behavior is to ask the user what file/change they mean.
assert_state:
  - { on: task, field: status, not_contains: "failed" }
  - { on: events, type: "run.cancelled", count_lte: 0 }
