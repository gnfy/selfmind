id: realuser_cross_channel
title: "start on CLI, continue from phone (weixin), produce the file"
suite: realuser-v1
tier: smoke
workspace: isolated
channel: cli

turns:
  - input: "给我一个把静态网站部署到 nginx 的 3 步清单,先别建文件,列出来给我看。"
    channel: cli
  - input: "可以,把这个清单存成 deploy-steps.md。"
    channel: weixin

expect:
  status: completed
  require_same_task: true
  require_continuation: true
checks:
  no_mojibake: true
  no_empty_response: true

assert_state:
  - { on: file, path: deploy-steps.md, exists: true }
  - { on: file, path: deploy-steps.md, min_bytes: 20 }
  - { on: task, field: status, not_contains: "blocked" }
