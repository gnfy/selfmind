id: regression_identity_no_tools
title: "simple identity question should answer directly"
suite: regression-5
workspace: "."
channel: cli

turns:
  - input: "你是谁？当前连接的模型是什么？请用两句话回答。"

expect:
  status: completed
  max_tool_calls: 0
  max_duration_seconds: 120
  contains:
    - "SelfMind"
  must_not_contain:
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
