id: regression_current_workspace_codebase
title: "codebase task should inspect the current SelfMind workspace"
suite: regression-5
workspace: "."
channel: cli

turns:
  - input: "分析当前工作目录下 selfmind 的入口文件，列出 CLI 入口和 daemon 入口各在哪里；不要分析旁边的 codex 或 hermes-agent 项目。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 2
  max_duration_seconds: 360
  contains:
    - "cmd/selfmind"
    - "gateway run"
  must_not_contain:
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
