id: regression_env_diagnosis_recovery
title: "failed local command should be diagnosed by ecosystem evidence"
suite: regression-5
workspace: "."
channel: cli

turns:
  - input: "检查当前项目的验证状态。如果命令失败，请先分析错误含义、项目生态、manifest、脚本和工作目录边界，再选择更合适的下一步；不要固定套用某一种语言的环境变量。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 4
  max_duration_seconds: 480
  contains:
    - "项目"
  must_not_contain:
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
