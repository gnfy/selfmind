id: regression_continue_after_plan
title: "continue should reuse the previous plan context"
suite: regression-5
workspace: "."
channel: cli

turns:
  - input: "先给一个优化 SelfMind 工具调用可视化体验的三步方案，不要改代码。"
  - input: "可以，继续，把刚才方案细化成可执行的开发清单，但仍然不要改代码。"

expect:
  status: completed
  require_same_task: true
  require_continuation: true
  max_duration_seconds: 360
  contains:
    - "工具"
  must_not_contain:
    - "不知道你要继续什么"
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
