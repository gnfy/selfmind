id: regression_js_autochess_snippet
title: "coding snippet should produce readable code without tool protocol leaks"
suite: regression-5
workspace: "."
channel: cli

turns:
  - input: "用 JS 写一个历史名将自走棋小游戏的最小可运行单文件示例。只需要直接给 HTML/JS 代码块，不要写入文件。"

expect:
  status: completed
  max_duration_seconds: 240
  contains:
    - "html"
    - "script"
  must_not_contain:
    - "<tool>"
    - "Process summary:"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
