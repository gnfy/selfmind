id: reliability_daily_quality_report
title: "daily quality report remains model-free and person-scoped"
suite: reliability
workspace: isolated
channel: cli
model_required: false

# The report is a deterministic control command. It must remain available
# without provider credentials and must never create task/run noise merely to
# inspect the existing execution evidence.
turns:
  - input: "/report daily --since 24h"

expect:
  status: completed
  require_no_task: true
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  contains:
    - "Daily quality report"
    - "Model:"
    - "Recall:"
    - "Maintenance:"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
  no_provider_stack_dump: true
