id: reliability_direct_answer_outcome
title: "A direct answer settles its Run and keeps the Interaction unlisted"
suite: reliability
workspace: isolated
channel: cli
ci:
  required: true
  reason: clean_checkout
  platforms: [linux, darwin]
require_cassette: false

turns:
  - input: "Reply with exactly: READY"

expect:
  status: completed
  completion_reason: completed
  resumable: false
  contains: ["READY"]
  max_tool_calls: 0
  max_duration_seconds: 60

assert_state:
  - { on: events, type: "run.outcome", payload_contains: '"status":"done"', count_gte: 1 }
  - { on: run, field: status, eq: "done" }
  - { on: task, field: kind, eq: "interaction" }
  - { on: task, field: visibility, eq: "unlisted" }

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
