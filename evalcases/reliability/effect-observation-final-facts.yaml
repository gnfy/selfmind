id: reliability_effect_observation_final_facts
title: "A bound read-only verification keeps another task's uncertain effect visible"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true
requires:
  commands: [cat]
setup:
  files:
    observed.state: "READY\n"
  task:
    title: "An earlier publish attempt"
    parked_runs:
      - input: "Publish the accepted revision"
        status: blocked
        unresolved_effect:
          summary: "publish accepted revision"
          exit_code: 1
turns:
  - input: >-
      This is a separate read-only observation task. Use verify to read
      observed.state, bound to the external effect claim ID appended below via
      effect_claim_id, with a named criterion and target. Report the observed
      state and finish done. Do not continue or settle the earlier publish
      task, do not call /effects settle, do not mutate anything, and do not say
      the earlier claim was released: a foreign-chain observation leaves it
      unresolved. No plan is needed for this single check.
      Use only verify and finish_run; do not store memory or invoke unrelated tools.
    seeded_effect_ordinal: 1
expect:
  status: completed
  max_tool_errors: 0
  max_duration_seconds: 300
  contains:
    - "Unresolved external effects"
    - "remain unresolved in the runtime"
    - "/effects"
assert_state:
  - on: approval
    count_lte: 0
  - on: approval_triage
    status: human_ask
    count_lte: 0
  - on: events
    type: external_effect.observed
    count_gte: 1
checks:
  no_empty_response: true
  no_raw_json_leak: true
