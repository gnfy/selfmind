id: reliability_external_watch_handoff
title: "external waits leave the model loop and become daemon-owned work"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true

# The polled command must report PENDING, not SUCCEEDED. Registration runs a
# preflight (added 2026-07-30) whose "observed success" outcome declines to
# register a watch for work that is already finished — correct behavior, but it
# makes a check that succeeds on its first run unable to produce the handoff
# this case exists to assert.
#
# Re-record this case after intentional watcher handoff contract changes:
#   SELFMIND_EVAL_VCR=record selfmind eval run \
#     evalcases/reliability/external-watch-handoff.yaml --live
turns:
  - input: "Register a durable external watch named CI completion. In the current workspace, poll the command printf 'PENDING\\n', treat SUCCEEDED as success, use a 5 second interval and a 60 second timeout. Successful watcher registration should hand the run off as waiting_external without another model turn or lifecycle call. Do not execute the polling command directly."

expect:
  status: waiting_external
  completion_reason: waiting_external
  resumable: false
  require_tool_events: true
  # watch_external is the single required action. Its trusted registration
  # result, rather than a second model-authored finish_run call, owns handoff.
  min_tool_calls: 1
  max_tool_errors: 0
  max_duration_seconds: 120

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
