id: reliability_external_watch_preflight_refuses_broken_check
title: "an unsupported durable watch falls back without repeating or asking approval"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true
ci:
  required: true
  reason: credentialless
  platforms: [linux, darwin]

setup:
  files:
    status.txt: "SUCCEEDED\n"

# Regression for the 2026-07-30 watcher incidents. A durable check has no host
# escape hatch and no model in the loop, so an unprovable command must fail
# before approval and registration. The typed result must tell the foreground
# agent that nothing was dispatched and that it needs a different strategy.
#
# The assertion is on the MESSAGE PATH: the first call is statically rejected
# before approval, then the foreground agent uses the explicitly supplied
# bounded observation instead of retrying watcher variants.
#
# Re-record this case after intentional watcher preflight changes:
#   SELFMIND_EVAL_VCR=record selfmind eval run \
#     evalcases/reliability/external-watch-preflight-refuses-broken-check.yaml --live
turns:
  - input: >-
      Use watch_external exactly once to register a durable watch named deploy
      status. Its requested check command is
      `selfmind-no-such-release-cli describe --status`, success is SUCCEEDED,
      failure is FAILED, interval is 30 seconds, and timeout is 300 seconds.
      If watcher preparation reports that nothing was dispatched and a
      different strategy is required, do not retry or ask approval. Use
      read_file on `status.txt` exactly once as the supported bounded
      observation, then report the observed status and complete the task.

expect:
  status: completed
  completion_reason: completed
  resumable: false
  require_tool_events: true
  min_tool_calls: 2
  max_tool_errors: 1
  max_duration_seconds: 180
  contains:
    - "SUCCEEDED"
  must_not_contain:
    - "waiting_external"
    - "approval timed out"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true

assert_state:
  - on: events
    type: tool.completed
    payload_contains: '"error_code":"watch_observation_unsupported"'
    count_gte: 1
  - on: events
    type: tool.completed
    payload_contains: '"retryability":"different_strategy"'
    count_gte: 1
  - on: events
    type: tool.completed
    payload_contains: '"effect_state":"not_dispatched"'
    count_gte: 1
