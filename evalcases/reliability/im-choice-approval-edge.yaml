id: reliability_im_choice_approval_edge
title: "An IM message carrying an approval edge never answers the multi-Run choice pending on that chat"
suite: reliability
workspace: isolated
model_required: false

setup:
  task:
    title: "Nightly report"
    parked_runs:
      - input: "Compile the nightly report"
        status: waiting_user
  turn_choices:
    - platform: weixin
      channel: wx-chat-1
      request: "Also attach the error summary"
      options:
        - action: resume
          parked_run: 1
        - action: new

turns:
  - input: "2"
    platform: weixin
    channel: wx-chat-1
    approval_id: approval_missing

expect:
  http_status: 409
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  must_not_contain:
    - "Saved your request as queued work"

assert_state:
  - on: runs
    count_lte: 1
  - on: turn_choices
    status: pending
    count_gte: 1
  - on: queued
    count_lte: 0

checks:
  no_mojibake: true
  no_raw_json_leak: true
