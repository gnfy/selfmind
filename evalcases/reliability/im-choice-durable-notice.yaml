id: reliability_im_choice_durable_notice
title: "An IM choice keeps its actionable notice in the durable outbox"
suite: reliability
workspace: isolated
model_required: false

runtime:
  max_active_work_runs: 2
  workers: 2

setup:
  delivery_enabled: true

turns:
  - input: "Inspect the parser"
    platform: cli
    channel: parser-session
    cwd: parser
    hold_worker: true
  - input: "Inspect the renderer"
    platform: cli
    channel: renderer-session
    cwd: renderer
    hold_worker: true
  - input: "/status"
    platform: weixin
    channel: wx-chat
    assert_state:
      - on: outbound
        count_lte: 0
      - on: turn_choices
        count_lte: 0
  - input: "Also inspect the other service"
    platform: weixin
    channel: wx-chat
    assert_state:
      - on: turn_choices
        status: pending
        count_gte: 1
        count_lte: 1
      - on: outbound
        count_gte: 1
        count_lte: 1
  - input: "/stop"
    platform: cli
    channel: parser-session
    turn_run_ordinal: 1
  - input: "/stop"
    platform: cli
    channel: renderer-session
    turn_run_ordinal: 2

expect:
  max_tool_calls: 0
  max_duration_seconds: 60
  contains:
    - "Which work is this for?"
    - "/choose choice_"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_provider_stack_dump: true
