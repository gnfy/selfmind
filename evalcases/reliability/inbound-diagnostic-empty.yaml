id: reliability_inbound_diagnostic_empty
title: "Inbound processing receipts have a model-free diagnostic"
suite: reliability
workspace: isolated
channel: cli
model_required: false

turns:
  - input: "/diag inbound"

expect:
  status: completed
  require_no_task: true
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  contains:
    - "No unresolved inbound messages"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
