id: reliability_inbound_diagnostic_empty
title: "Inbound receipt diagnostics expose control state without source text"
suite: reliability
workspace: isolated
channel: cli
model_required: false

setup:
  inbound:
    - platform: telegram
      message_id: private-source
      content: "private-source-text api_key=example-secret"
      dispatching: true
    - platform: weixin
      message_id: second-source
      content: "another-channel-private-text"

turns:
  - input: "/diag inbound"

expect:
  status: completed
  require_no_task: true
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  contains:
    - "Unresolved inbound messages: 2"
    - "dispatching"
    - "pending"
  must_not_contain:
    - "private-source-text"
    - "example-secret"
    - "another-channel-private-text"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
