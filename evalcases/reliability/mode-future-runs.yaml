id: reliability_mode_future_runs
title: "person mode changes apply to newly admitted Runs"
suite: reliability
workspace: isolated
channel: cli
model_required: false
ci:
  required: true
  reason: cross_platform
  platforms: [linux, darwin]

turns:
  - input: "/mode full-auto"

expect:
  status: completed
  max_tool_calls: 0
  max_tool_errors: 0
  max_duration_seconds: 30
  contains:
    - "for new Runs"
    - "Existing Runs and pending approvals keep their admitted mode"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
