id: reliability_model_status_control
title: "model route status remains a model-free cross-channel control"
suite: reliability
workspace: isolated
channel: cli
model_required: false

turns:
  - input: "/model"

expect:
  status: completed
  require_no_task: true
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  contains:
    - "Model routes"
    - "Running primary"
    - "Running background"
    - "fast_classifier: uses background model"
    - "memory_extract: uses background model"
    - "skill_curator: uses background model"
    - "selfmind model"
    - "Generation:"
  must_not_contain:
    - "display-only"
    - "Unknown command"
    - "model set"
    - "model check"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
  no_provider_stack_dump: true
