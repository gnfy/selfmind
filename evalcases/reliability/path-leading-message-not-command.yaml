id: reliability_path_leading_message_not_command
title: "A '/'-leading file path message is agent work, not an unknown command"
suite: reliability
workspace: isolated
channel: cli
ci:
  required: true
  reason: cross_platform
  platforms: [linux, darwin]
require_cassette: false

# Observed live (2026-07-27): pasting a clipboard image put its WSL path at the
# start of the composer, and "/mnt/c/...png <question>" was rejected as
# "Unknown command" by the leading-slash gate. The shared command-shape
# predicate (command.LooksLikeCommand) must keep path-leading prose on the
# agent-first message path across every surface (TUI, gateway ingress, queue
# drain, clarify answers).
turns:
  - input: "/tmp/selfmind-paste-1.png 这个路径的图片先不用打开，请直接回复收到"

expect:
  status: completed
  max_duration_seconds: 120
  must_not_contain:
    - "Unknown command"

checks:
  no_mojibake: true
  no_empty_response: true
  no_provider_stack_dump: true
