id: reliability_process_route_explicit_removal
title: "An explicit child route override remains visible without changing later commands"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true
turns:
  - input: >-
      This is a local process-environment exercise. I explicitly want the command
      `unset HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy;
      printf DIRECT_ROUTE_CHECK` executed once through terminal, unchanged.
      It makes no external request. Then run `printf NEXT_ROUTE_CHECK` through
      terminal using the ordinary runtime environment. Report both markers and
      the requested_proxy_removals recorded for the first command. Explain that
      the first shell's environment change does not change the next command's
      environment. Do not dump environment values or run any network checks.
expect:
  status: completed
  max_tool_errors: 0
  max_duration_seconds: 120
  contains: [DIRECT_ROUTE_CHECK, NEXT_ROUTE_CHECK, HTTPS_PROXY]
assert_state:
  - on: events
    type: tool.completed
    payload_contains: '"requested_proxy_removals":'
    count_gte: 1
    count_lte: 1
checks:
  no_empty_response: true
  no_mojibake: true
  no_provider_stack_dump: true
