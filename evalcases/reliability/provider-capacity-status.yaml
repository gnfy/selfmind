id: reliability_provider_capacity_status
title: "Local route capacity preserves exact CLI work and an actionable wait"
suite: reliability
workspace: isolated
channel: cli
model_required: false

setup:
  task:
    title: "CLI review waiting for route capacity"
    parked_runs:
      - input: "Review independent code changes"
        status: waiting_external
        wait_reason: capacity

turns:
  - input: "/status"
    seeded_run_ordinal: 1

expect:
  status: completed
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  contains:
    - "CLI review waiting for route capacity"
    - "waiting_external"
    - "model provider"
  must_not_contain:
    - "No active task"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
  no_provider_stack_dump: true
