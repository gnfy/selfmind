id: reliability_resume_changed_criterion_rechecks
title: "A continuation whose acceptance criterion changed rechecks instead of adopting the old pass"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true
# The constraint that must change the result for the bare-confirmation cases:
# the user replaces the criterion, so the passed READY check cannot be adopted.
# Main's negative condition judgment is separate from the script exit code.
# The positive acceptance gate stays unresolved; a zero-exit observation may
# report a valid negative finding but cannot complete that required milestone.
requires:
  commands: [python3]
setup:
  files:
    value.txt: "READY\n"
turns:
  - input: >-
      Check whether value.txt contains exactly READY followed by a newline.
      Use a plan with a verification_required step for that acceptance condition,
      run verify to establish it, and mark the step completed. Then stop and
      wait for my confirmation before reporting the result: keep a distinct
      pending reporting step and record waiting_user with finish_run. Do not
      modify value.txt.
    assert_state:
      - on: run
        field: status
        eq: waiting_user
      - on: events
        type: evidence.recorded
        payload_fields:
          evidence.tool_name: verify
        count_gte: 1
  - input: "确认，但验收条件改了：value.txt 必须恰好是 DONE 加换行。按新条件复查并报告，不要修改文件。如果不符合，保留这项必需验收为未完成并报告阻塞，不要把验收改成只要查明即可。"
expect:
  condition_state: not_met
  max_duration_seconds: 300
assert_state:
  - on: run
    field: status
    eq: blocked
  - on: events
    type: tool.completed
    payload_contains: '"error_category":"invalid_input"'
    count_lte: 0
  - on: events
    type: tool.completed
    payload_contains: '"error_category":"stale_precondition"'
    count_lte: 0
  - on: events
    type: strategy.plan_guidance_escalated
    count_lte: 0
  - on: events
    type: work.selection_committed
    count_gte: 1
  - on: events
    type: evidence.recorded
    payload_contains: '"kind":"verification"'
    count_gte: 2
  - on: file
    path: value.txt
    matches: '\AREADY\n\z'
checks:
  no_empty_response: true
  no_raw_json_leak: true
