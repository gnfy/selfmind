id: reliability_resume_exact_run_control
title: "An unknown resume selection never executes or selects other work"
suite: reliability
workspace: isolated
channel: cli
model_required: false

turns:
  - input: "/resume run_missing"

expect:
  status: completed
  require_no_task: true
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  contains:
    - "not found or no longer resumable"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
