id: reliability_skill_before_resume
title: "Skill attribution before selecting historical work does not block continuation"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true
setup:
  files:
    version.txt: "version=R42\n"
    .selfmind/skills/prepared-inspection/SKILL.md: |-
      ---
      name: prepared-inspection
      description: Inspect the prepared version and report its exact value
      ---

      ## Procedure

      Read version.txt with read_file. Report its exact version value.
      No shell command, file modification or network request is required.
  task:
    title: "Prepared version inspection"
    parked_runs:
      - input: "Inspect the prepared version after confirmation. Report version.txt exactly; waiting for confirmation."
        status: waiting_user
turns:
  - input: >-
      Continue the prepared version inspection. First activate the applicable
      prepared-inspection Skill using its current candidate_ref. Activation is
      only instruction loading, not completion. Then find and inspect the
      waiting Prepared version inspection Run, and use work_select(resume)
      to continue that exact Run here. Read version.txt, resolve the inherited
      plan if present, and finish with its actual result. Do not write files.
expect:
  status: completed
  resumable: false
  contains: [R42]
  max_tool_errors: 0
  max_duration_seconds: 180
assert_state:
  - {on: run, field: resumes_run_id, empty: false}
  - {on: events, type: skill.activated, count_gte: 1}
  - on: events
    type: work.selection_committed
    payload_contains: '"commit_mode":"direct"'
    count_gte: 1
  - {on: events, type: work.selection_rejected, count_lte: 0}
checks:
  no_empty_response: true
  no_mojibake: true
  no_raw_json_leak: true
