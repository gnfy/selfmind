id: reliability_verification_explicit_pending_step
title: "Checks bind to an explicitly selected pending milestone without extra Plan transitions"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true
requires:
  commands: [python3]
setup:
  files:
    first.txt: "READY\n"
    second.txt: "READY\n"
turns:
  - input: >-
      Check that first.txt and second.txt each contain exactly READY followed by
      a newline. Create a two-step plan with one verification_required step per
      file: the first in_progress and the second pending. Verify second.txt
      first, explicitly selecting its server-issued step_id while it is still
      pending. Then verify first.txt against its own step_id. Declare each
      check's criterion, target and local_dependencies. Do not modify files or
      move a step to in_progress just for verification bookkeeping. Complete
      both steps in one final plan snapshot, and finish done with the result.
      Use only update_plan, verify and finish_run; do not store memory or
      invoke unrelated tools.
expect:
  status: completed
  verification_state: passed
  max_tool_errors: 0
  max_duration_seconds: 300
assert_state:
  - on: events
    type: evidence.recorded
    payload_contains: '"kind":"verification"'
    count_gte: 2
    count_lte: 2
  - on: events
    type: plan.updated
    count_gte: 2
    count_lte: 2
checks:
  no_empty_response: true
  no_raw_json_leak: true
