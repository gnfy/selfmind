id: reliability_verification_partial
title: "Changed work with failed verification remains resumable"
suite: reliability
workspace: isolated
channel: cli
setup:
  files:
    verification-target.txt: "before\n"
turns:
  - input: >-
      Replace verification-target.txt with the word after, then run the command
      false exactly once as the verification step. Do not repair or rerun the
      verification. Report that the change exists but verification is incomplete.
expect:
  status: verification_partial
  completion_reason: verification_failed
  resumable: true
  verification_state: failed
  require_tool_events: true
  min_tool_calls: 2
  max_duration_seconds: 120
checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_provider_stack_dump: true
  context_not_exceeded: true
assert_state:
  # The runner keys predicates on `on:`; `subject:`/`op:` were never a
  # supported spelling, so both entries silently resolved to an empty target
  # and reported "unknown predicate target" the first time this case actually
  # ran end to end.
  - on: task
    field: status
    eq: verification_partial
  - on: file
    path: verification-target.txt
    exists: true
    contains: "after"
