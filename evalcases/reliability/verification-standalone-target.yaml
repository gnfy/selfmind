id: reliability_verification_standalone_target
title: "An independent named observation cannot satisfy a different milestone"
suite: reliability
workspace: isolated
channel: cli
require_cassette: true
requires:
  commands: [python3]
setup:
  files:
    requested.txt: "NOT_READY\n"
    unrelated.txt: "READY\n"
turns:
  - input: >-
      Determine whether requested.txt contains exactly READY followed by a
      newline. Create one verification_required Plan milestone for that exact
      condition. Also collect an independent observation that unrelated.txt
      contains READY, using verify with criterion "unrelated.txt contains READY",
      target "unrelated.txt", local_dependencies: ["unrelated.txt"], and no
      step_id. That unrelated result must not complete the requested milestone.
      Verify requested.txt against its actual step_id, preserve the failed
      condition as unfinished, and finish blocked with a clear result. Do not
      modify either file, change the acceptance condition or cancel the step.
      Use only update_plan, verify and finish_run; do not store memory or
      invoke unrelated tools.
expect:
  status: blocked
  verification_state: failed
  max_duration_seconds: 300
assert_state:
  - on: events
    type: evidence.recorded
    payload_contains: '"kind":"verification"'
    count_gte: 2
  # Pin durable attribution, not just the final failed outcome. A named
  # independent target stays standalone through every attempt; requested checks
  # may retry without changing this invariant.
  - on: events
    type: evidence.recorded
    payload_contains: '"target":"unrelated.txt","version":2'
    count_gte: 1
  - on: events
    type: evidence.recorded
    payload_contains: '"target":"unrelated.txt","version":3'
    count_lte: 0
checks:
  no_empty_response: true
  no_raw_json_leak: true
