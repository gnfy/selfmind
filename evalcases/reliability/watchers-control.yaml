id: reliability_watchers_control
title: "watcher status remains a model-free control command"
suite: reliability
workspace: isolated
channel: cli
model_required: false

turns:
  - input: "/watchers"

expect:
  status: completed
  require_no_task: true
  require_no_run: true
  max_tool_calls: 0
  max_duration_seconds: 30
  contains:
    - "Watchers"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
  no_provider_stack_dump: true
