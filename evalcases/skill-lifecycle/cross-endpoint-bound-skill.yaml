id: skill_cross_endpoint_bound
title: "A deterministic IM continuation loads the task-bound Skill without a directory dump"
suite: skill-lifecycle
workspace: isolated
channel: weixin
require_cassette: true

setup:
  files:
    release.txt: "release=v1.2.3\n"
    .selfmind/skills/release-inspection/SKILL.md: |-
      ---
      name: release-inspection
      description: 检查发布版本和发布元数据
      ---

      # Procedure

      Read `release.txt` with the read-only file tool. Report the exact release
      value. Do not modify files and do not guess when the file is unavailable.

      # Verification

      For this read-only lookup, the successful bounded read is the evidence.
  task:
    title: "Inspect the current release"
    default_skill: release-inspection
    # P2: a bare continuation binds through the run ladder, so the bound task
    # must hold an unclaimed resumable run for the IM cue to continue it.
    parked_runs:
      - input: "开始检查当前发布版本"
        status: waiting_user

turns:
  - input: "继续"
    channel: weixin

expect:
  status: completed
  contains: ["v1.2.3"]
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 0
  max_duration_seconds: 180

assert_state:
  - on: events
    type: skill.activated
    payload_contains: '"name":"release-inspection"'
    count_gte: 1
  - on: events
    type: context.selected
    payload_contains: '"skill_directory_chars":0'
    count_gte: 1
  - on: events
    type: context.selected
    payload_contains: '"skill_delivery_valid":true'
    count_gte: 1
  - on: events
    type: tool.started
    payload_contains: '"tool_origin":"builtin"'
    count_gte: 1

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
