id: smoke_php_pgsql_002
title: "generate a PHP PostgreSQL example"
suite: smoke-10
workspace: "."
channel: cli

turns:
  - input: "用 PHP 写一个连接 PostgreSQL 并查询一行数据的最小示例，只需要代码和简短说明。"

expect:
  status: completed
  contains:
    - "php"
  must_not_contain:
    - "<tool>"
    - "\"tool_calls\""
  max_duration_seconds: 120

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
