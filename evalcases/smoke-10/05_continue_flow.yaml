id: smoke_continue_flow_005
title: "continue after a plan without losing context"
suite: smoke-10
# Declared isolated because this case makes no tool calls: nothing here
# reads the repository, and a workspace of "." would let one added tool
# call silently make the cassette depend on the tree it was recorded in.
workspace: isolated
channel: cli

turns:
  - input: "先给一个优化 SelfMind CLI 交互体验的三步方案，不要改代码。"
  - input: "可以，继续。"

expect:
  status: completed
  require_same_task: true
  require_continuation: true
  must_not_contain:
    - "不知道你要继续什么"
  max_duration_seconds: 360

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  context_not_exceeded: true
