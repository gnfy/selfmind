id: smoke_codebase_overview_006
title: "inspect SelfMind codebase overview"
suite: smoke-10
workspace: "."
channel: cli

turns:
  - input: "分析一下当前 selfmind 项目的代码结构，列出已经实现的核心能力和两个最值得改进的地方。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 4
  contains:
    - "selfmind"
  max_duration_seconds: 360

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
