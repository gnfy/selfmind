id: smoke_skill_architecture_007
title: "inspect local skill loading architecture"
suite: smoke-10
workspace: "."
channel: cli
# Measured replay cost: 46.2s — excluded from `selfcheck --fast`.
slow: true

turns:
  - input: "查看 selfmind 读取本地 skills 的相关代码，简要说明加载顺序和目前可能的缺口。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 4
  contains:
    - "skill"
  max_duration_seconds: 360

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
