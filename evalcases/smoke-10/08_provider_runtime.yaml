id: smoke_provider_runtime_008
title: "inspect provider runtime design"
suite: smoke-10
workspace: "."
channel: cli
# Measured replay cost: 59.1s — excluded from `selfcheck --fast`.
slow: true

turns:
  - input: "查看 selfmind 的 provider runtime 相关代码和文档，说明它如何支持多模型服务商，以及最需要补强的一点。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
  max_tool_errors: 4
  contains:
    - "provider"
  max_duration_seconds: 360

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_tool_xml_leak: true
  no_empty_response: true
  no_provider_stack_dump: true
  tool_failure_should_recover: true
  workspace_should_match: true
  context_not_exceeded: true
