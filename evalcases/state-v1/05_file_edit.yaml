id: state_file_edit
title: "edit an existing seeded file in place"
suite: state-v1
tier: smoke
workspace: isolated
channel: cli

setup:
  files:
    "notes.txt": |
      line one
      line two

turns:
  - input: "在当前目录的 notes.txt 文件末尾追加一行,内容就是 DONE-MARKER,保留原有内容。"

expect:
  status: completed
  require_tool_events: true
  min_tool_calls: 1
checks:
  no_mojibake: true
  no_empty_response: true

assert_state:
  - { on: file, path: notes.txt, exists: true }
  - { on: file, path: notes.txt, contains: "DONE-MARKER" }
  - { on: file, path: notes.txt, contains: "line one" }
  - { on: events, type: "tool.completed", count_gte: 1 }
