id: timeline_natural_progress_cross_endpoint
title: "natural-language IM progress is understood inside one audited Main run"
require_cassette: true
suite: timeline
workspace: isolated
channel: cli

setup:
  task:
    title: "RUQX-767 production release"
    parked_runs:
      - input: "release PHP services for RUQX-767 from CLI"
        status: interrupted

turns:
  - input: "刚才 RUQX-767 的发布任务进展怎么样？"
    channel: weixin

expect:
  status: completed
  http_status: 200
  min_tool_calls: 3
  max_tool_calls: 4
  max_duration_seconds: 90
  contains:
    - "RUQX-767"
    - "interrupted"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true

assert_state:
  - on: events
    type: work.selection_committed
    payload_contains: '"action":"observe"'
    count_gte: 1
