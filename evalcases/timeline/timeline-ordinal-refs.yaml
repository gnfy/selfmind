id: timeline_ordinal_refs
title: "ordinal references: the number a listing printed resolves that exact Run"
suite: timeline
workspace: "."
channel: cli
model_required: false

# Control-command turns only. Bare /resume is the numbered listing, and the
# number it printed must continue that exact Run. The ordinal snapshot used to
# live in the /tasks render, which made "continue number 1" depend on a listing
# about labels rather than about runs.
setup:
  task:
    title: "ordinal reference check"
    parked_runs:
      - input: "wait for exact resume"
        status: waiting_user

turns:
  - input: "/resume"
  - input: "/resume 1"

expect:
  status: completed
  max_tool_calls: 0
  max_duration_seconds: 60
  contains:
    - "Needs attention:"
    - "wait for exact resume"
    - "Selected run"
    - "Your next message"
  must_not_contain:
    - "Unknown command"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
