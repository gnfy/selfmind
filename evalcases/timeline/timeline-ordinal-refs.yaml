id: timeline_ordinal_refs
title: "ordinal references: /task <n> and /resume <n> follow the /tasks card order"
suite: timeline
workspace: "."
channel: cli
model_required: false

# Control-command turns only. The number printed by Attention must resolve the
# same exact Run through /task <n> and /resume <n>.
setup:
  task:
    title: "ordinal reference check"
    parked_runs:
      - input: "wait for exact resume"
        status: waiting_user

turns:
  - input: "/tasks"
  - input: "/task 1"
  - input: "/resume 1"

expect:
  status: completed
  max_tool_calls: 0
  max_duration_seconds: 60
  contains:
    - "Needs attention:"
    - "Task: ordinal reference check"
    - "Selected run"
    - "Your next message"

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
