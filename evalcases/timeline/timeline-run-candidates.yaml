id: timeline_run_candidates
title: "natural-language acceptance selects prior work inside Main without a cue dictionary"
suite: timeline
require_cassette: true
workspace: isolated
channel: cli

# Ordinary language reaches Main even beside pending work. Main interprets
# the proposal and uses the broker to claim the exact execution relationship.
# Re-record after changing the default continuity prompt or message path.
setup:
  task:
    title: "Documentation outline"
    parked_runs:
      - input: "Prepare a three-part outline explaining how to organize a small project's documentation. Wait for my confirmation before giving the outline; after confirmation, provide it without reading files or running commands."
        status: waiting_user

turns:
  - input: "Sigamos con lo que propusiste."

expect:
  status: completed
  http_status: 200
  max_tool_calls: 8
  max_tool_errors: 0
  max_duration_seconds: 180
  must_not_contain:
    - "I found several possible continuations."
    - "queued as the next exact continuation"

checks:
  no_mojibake: true
  no_raw_json_leak: true
  no_empty_response: true

assert_state:
  - on: events
    type: work.selection_committed
    payload_contains: '"commit_mode":"direct"'
    count_gte: 1
  - on: run
    field: resumes_run_id
    empty: false
