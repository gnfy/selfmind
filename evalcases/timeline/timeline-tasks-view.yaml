id: timeline_tasks_view
title: "derived Attention lists an exact resumable Run"
suite: timeline
workspace: "."
channel: cli
model_required: false

# Control-command turns only: a waiting Run is actionable and the listing names
# the exact Run, not a label. Settled history is absent.
setup:
  task:
    title: "时间线视图验证"
    parked_runs:
      - input: "执行验证并等待确认"
        status: waiting_user

turns:
  - input: "/resume"

expect:
  status: completed
  max_tool_calls: 0
  max_duration_seconds: 60
  contains: ["Needs attention:", "执行验证并等待确认", "run_"]
  must_not_contain: ["Unknown command"]

checks:
  no_mojibake: true
  no_empty_response: true
  no_raw_json_leak: true
